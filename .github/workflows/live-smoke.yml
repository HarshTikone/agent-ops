name: Live provider smoke test

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Model identifiers are public configuration, not credentials. Keeping
      # this alongside .env.example prevents an otherwise-valid key from
      # becoming a half-configured fallback when no model secret exists.
      OPENROUTER_MODEL: nvidia/nemotron-3-super-120b-a12b:free
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: python -m scripts.migrate
      - name: Verify release dependencies
        run: python -m scripts.release_check
      - name: Run opt-in live tests
        run: pytest -m live -o addopts="" -v
