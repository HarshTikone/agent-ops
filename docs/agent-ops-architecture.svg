<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent Ops auditable execution architecture</title>
  <desc id="desc">A user request flows through a planner, specialized sub-agents, tools, a human approval gate, and a verifier. Every stage writes events to a durable trace store. Gemini uses OpenRouter as its fallback provider.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head-accent"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #ffffff; }
      .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 2; }
      .node-accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 2.5; }
      .node-warning { fill: #fff8c5; stroke: #9a6700; stroke-width: 2.5; }
      .node-success { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2.5; }
      .trace { fill: #f6f8fa; stroke: #57606a; stroke-width: 2.5; }
      .title { fill: #1f2328; font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .subtitle { fill: #57606a; font: 400 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #1f2328; font: 700 21px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .detail { fill: #57606a; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .kicker { fill: #0969da; font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1.5px; text-anchor: middle; }
      .edge-label { fill: #57606a; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #57606a; stroke-width: 3; marker-end: url(#arrow); }
      .flow-accent { fill: none; stroke: #0969da; stroke-width: 3; marker-end: url(#arrow-accent); }
      .telemetry { fill: none; stroke: #8c959f; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .decision { fill: none; stroke: #9a6700; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .arrow-head { fill: #57606a; }
      .arrow-head-accent { fill: #0969da; }
      .divider { stroke: #d0d7de; stroke-width: 1.5; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d1117; }
        .node { fill: #161b22; stroke: #6e7681; }
        .node-accent { fill: #0c2d48; stroke: #58a6ff; }
        .node-warning { fill: #3b2e09; stroke: #d29922; }
        .node-success { fill: #12261e; stroke: #3fb950; }
        .trace { fill: #161b22; stroke: #8c959f; }
        .title, .label { fill: #f0f6fc; }
        .subtitle, .detail, .edge-label { fill: #b1bac4; }
        .kicker { fill: #58a6ff; }
        .flow { stroke: #8c959f; }
        .flow-accent { stroke: #58a6ff; }
        .telemetry { stroke: #6e7681; }
        .decision { stroke: #d29922; }
        .arrow-head { fill: #8c959f; }
        .arrow-head-accent { fill: #58a6ff; }
        .divider { stroke: #30363d; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="820" rx="18"/>

  <text x="70" y="67" class="title">Agent Ops — auditable execution architecture</text>
  <text x="70" y="101" class="subtitle">Every decision is visible, every risky action is gated, and every run leaves a durable record.</text>

  <!-- Provider resilience -->
  <g filter="url(#shadow)">
    <rect x="286" y="137" width="210" height="78" rx="12" class="node-accent"/>
    <text x="391" y="163" class="kicker">PRIMARY LLM</text>
    <text x="391" y="191" class="label">Gemini</text>
    <rect x="518" y="137" width="210" height="78" rx="12" class="node"/>
    <text x="623" y="163" class="kicker">AUTOMATIC FALLBACK</text>
    <text x="623" y="191" class="label">OpenRouter</text>
  </g>
  <path d="M496 176 H510" class="flow"/>
  <text x="507" y="126" class="edge-label">timeout / 5xx</text>
  <path d="M505 216 C505 238 410 235 410 268" class="flow-accent"/>

  <!-- Main execution path -->
  <g filter="url(#shadow)">
    <rect x="70" y="285" width="180" height="126" rx="14" class="node"/>
    <text x="160" y="319" class="kicker">REQUEST</text>
    <text x="160" y="352" class="label">User</text>
    <text x="160" y="381" class="detail">goal + context</text>

    <rect x="294" y="268" width="230" height="160" rx="14" class="node-accent"/>
    <text x="409" y="303" class="kicker">ORCHESTRATION</text>
    <text x="409" y="338" class="label">Planner agent</text>
    <line x1="323" y1="356" x2="495" y2="356" class="divider"/>
    <text x="409" y="382" class="detail">decomposes the goal</text>
    <text x="409" y="404" class="detail">routes each step</text>

    <rect x="568" y="268" width="250" height="160" rx="14" class="node"/>
    <text x="693" y="303" class="kicker">SPECIALISTS</text>
    <text x="693" y="338" class="label">Sub-agents</text>
    <line x1="597" y1="356" x2="789" y2="356" class="divider"/>
    <text x="693" y="382" class="detail">researcher · operator</text>
    <text x="693" y="404" class="detail">analyst · verifier helper</text>

    <rect x="862" y="268" width="250" height="160" rx="14" class="node"/>
    <text x="987" y="303" class="kicker">CONTROLLED I/O</text>
    <text x="987" y="338" class="label">Tools</text>
    <line x1="891" y1="356" x2="1083" y2="356" class="divider"/>
    <text x="987" y="382" class="detail">web_search · notes_store</text>
    <text x="987" y="404" class="detail">calculator · bounded retry</text>

    <rect x="1156" y="268" width="220" height="160" rx="14" class="node-warning"/>
    <text x="1266" y="303" class="kicker">HUMAN-IN-THE-LOOP</text>
    <text x="1266" y="338" class="label">Approval gate</text>
    <line x1="1185" y1="356" x2="1347" y2="356" class="divider"/>
    <text x="1266" y="382" class="detail">irreversible actions pause</text>
    <text x="1266" y="404" class="detail">approve or reject</text>

    <rect x="1420" y="268" width="150" height="160" rx="14" class="node-success"/>
    <text x="1495" y="303" class="kicker">QUALITY</text>
    <text x="1495" y="338" class="label">Verifier</text>
    <line x1="1441" y1="356" x2="1549" y2="356" class="divider"/>
    <text x="1495" y="382" class="detail">checks evidence</text>
    <text x="1495" y="404" class="detail">before finalizing</text>
  </g>

  <path d="M250 348 H286" class="flow-accent"/>
  <path d="M524 348 H560" class="flow-accent"/>
  <path d="M818 348 H854" class="flow-accent"/>
  <path d="M1112 348 H1148" class="flow-accent"/>
  <path d="M1376 348 H1412" class="flow-accent"/>

  <text x="1132" y="327" class="edge-label">policy check</text>
  <path d="M160 411 C160 500 1266 495 1266 436" class="decision"/>
  <text x="742" y="485" class="edge-label">human decision: approve / reject</text>

  <!-- Durable trace -->
  <g filter="url(#shadow)">
    <rect x="220" y="590" width="1160" height="146" rx="16" class="trace"/>
    <text x="800" y="628" class="kicker">APPEND-ONLY OBSERVABILITY</text>
    <text x="800" y="666" class="label">Durable trace store</text>
    <text x="800" y="700" class="detail">plans · provider failovers · tool calls · retries · security blocks · approvals · timing · tokens · cost</text>
  </g>

  <path d="M160 420 V550 H390 V582" class="telemetry"/>
  <path d="M409 428 V582" class="telemetry"/>
  <path d="M693 428 V582" class="telemetry"/>
  <path d="M987 428 V582" class="telemetry"/>
  <path d="M1266 428 V550 H1120 V582" class="telemetry"/>
  <path d="M1495 428 V550 H1270 V582" class="telemetry"/>
  <text x="800" y="548" class="edge-label">each stage emits structured events</text>
</svg>
