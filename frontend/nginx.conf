server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file resolves to
    # index.html so client-side routing (added Day 4) works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
