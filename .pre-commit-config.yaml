# Local hooks that reuse the exact same tools/configs as CI (backend's
# pyproject.toml, frontend's eslint.config.js/.prettierrc.json) so a commit
# never passes locally and fails in GitHub Actions for a different reason.
#
# Setup (once): pip install pre-commit && pre-commit install
# Requires backend/.venv (or an active env with requirements-dev.txt
# installed) and frontend/node_modules to already exist.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        name: backend ruff check
        files: ^backend/.*\.py$
        args: [--config, backend/pyproject.toml]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.3.1
    hooks:
      - id: black
        name: backend black --check
        files: ^backend/.*\.py$
        args: [--check, --config, backend/pyproject.toml]

  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix frontend exec -- eslint
        language: system
        files: ^frontend/.*\.(ts|tsx)$

      - id: frontend-prettier
        name: frontend prettier --check
        entry: npm --prefix frontend exec -- prettier --check
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json|md)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
